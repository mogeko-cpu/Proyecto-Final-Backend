name: Calidad P3
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clena
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clena -d clena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clena:ci-only-password@localhost:5432/clena_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      SEED_DEMO: 'false'
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage }
