name: Historia de usuario
description: Historia del Product Backlog de P3
title: 'HU: '
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como [rol] quiero [acción] para [beneficio].
    validations: { required: true }
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Dado / Cuando / Entonces; incluir errores y autorización.
    validations: { required: true }
  - type: input
    id: puntos
    attributes: { label: Estimación en puntos }
    validations: { required: true }
